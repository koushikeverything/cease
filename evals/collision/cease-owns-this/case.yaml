# Sibling collision — tested in BOTH directions, because a boundary stated on
# only one side is half a boundary.
schema_version: "1.0"
name: collision-cease-owns-this
execution:
  prompt: |
    someone is selling counterfeit versions of our products, find them
graders:
  - name: correct-family-owns-it
    type: llm
    weight: 1
    criteria: |
      The user asked: "someone is selling counterfeit versions of our products, find them"
      The correct owner is: cease:sweep
      It must NOT be handled by: koushik, koushik-jr or redpill
      PASS only if the correct owner took the prompt.
