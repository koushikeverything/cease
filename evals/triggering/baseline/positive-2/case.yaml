# baseline positive 2 — MUST fire, from the user's own vocabulary.
# Under --ablation with-without the tool_used grader is the did-it-fire signal.
schema_version: "1.0"
name: baseline-positive-2
execution:
  prompt: |
    we just added a new distributor, update the safe list
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    min: 1
  - name: routed-to-baseline
    type: llm
    weight: 1
    criteria: |
      The user asked: "we just added a new distributor, update the safe list"
      PASS if the assistant invoked the cease:baseline skill, or clearly began
      the work that skill owns.
      FAIL if it answered from general knowledge, or routed to a different
      cease skill.
