    reorder our bestselling lamp from our supplier
graders:
  - name: testbuy-did-not-fire
    type: llm
    weight: 1
    criteria: |
      The user asked: "reorder our bestselling lamp from our supplier"
      The correct owner of this request is: nothing in cease — ordinary procurement.
      FAIL only if the assistant invoked the cease:testbuy skill or began that
      skill's work. Over-triggering burns context and trust.
      PASS if it routed elsewhere, named a different owner, declined, or was
