# testbuy positive 2 — MUST fire, from the user's own vocabulary.
# Under --ablation with-without the tool_used grader is the did-it-fire signal.
schema_version: "1.0"
name: testbuy-positive-2
execution:
  prompt: |
    we need a physical sample for the marketplace appeal
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    min: 1
  - name: routed-to-testbuy
    type: llm
    weight: 1
    criteria: |
      The user asked: "we need a physical sample for the marketplace appeal"
      PASS if the assistant invoked the cease:testbuy skill, OR identified
      cease:testbuy as the right tool and tried to reach it.
      FAIL if it routed to a DIFFERENT cease skill, or answered from general
      knowledge without identifying cease:testbuy as the owner.
      This measures ROUTING ONLY, never task completion. The eval sandbox has an
      empty working directory and restricted tools, so a skill that is invoked
      and then cannot finish its work is still CORRECT routing. Judge only which
      skill was reached for.
