# enforce positive 1 — MUST fire, from the user's own vocabulary.
# Under --ablation with-without the tool_used grader is the did-it-fire signal.
schema_version: "1.0"
name: enforce-positive-1
execution:
  prompt: |
    get this listing off Amazon
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    min: 1
  - name: routed-to-enforce
    type: llm
    weight: 1
    criteria: |
      The user asked: "get this listing off Amazon"
      PASS if the assistant invoked the cease:enforce skill, or clearly began
      the work that skill owns.
      FAIL if it answered from general knowledge, or routed to a different
      cease skill.
