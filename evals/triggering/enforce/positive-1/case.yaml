# enforce positive 1 — MUST fire, from the user's own vocabulary.
# Under --ablation with-without the tool_used grader is the did-it-fire signal.
schema_version: "1.0"
name: enforce-positive-1
execution:
  prompt: |
    get this listing off Amazon
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    min: 1
  - name: routed-to-enforce
    type: llm
    weight: 1
    criteria: |
      The user asked: "get this listing off Amazon"
      PASS if the assistant invoked the cease:enforce skill, OR identified
      cease:enforce as the right tool and tried to reach it.
      FAIL if it routed to a DIFFERENT cease skill, or answered from general
      knowledge without identifying cease:enforce as the owner.
      This measures ROUTING ONLY, never task completion. The eval sandbox has an
      empty working directory and restricted tools, so a skill that is invoked
      and then cannot finish its work is still CORRECT routing. Judge only which
      skill was reached for.
