# sweep positive 2 — MUST fire, from the user's own vocabulary.
# Under --ablation with-without the tool_used grader is the did-it-fire signal.
schema_version: "1.0"
name: sweep-positive-2
execution:
  prompt: |
    is someone running our ads on their own page?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    min: 1
  - name: routed-to-sweep
    type: llm
    weight: 1
    criteria: |
      The user asked: "is someone running our ads on their own page?"
      PASS if the assistant invoked the cease:sweep skill, or clearly began
      the work that skill owns.
      FAIL if it answered from general knowledge, or routed to a different
      cease skill.
